<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Аурелия — лист персонажа</title>

  <link rel="icon" type="image/png" href="./bardfav.png" />
  <script type="module" src="./scripts/app.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/reset.css">
  <link rel="stylesheet" href="./styles/layout.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/tabs.css">
  <link rel="stylesheet" href="./styles/profile.css">
  <link rel="stylesheet" href="./styles/melee.css">
  <link rel="stylesheet" href="./styles/spells.css">
  <link rel="stylesheet" href="./styles/spell-library.css">
  <link rel="stylesheet" href="./styles/inventory.css">
  <link rel="stylesheet" href="./styles/utilities.css">
  <link rel="stylesheet" href="./styles/responsive.css">
</head>
<body>
  <div class="page">
    <header class="topbar card">
      <div class="brand">
        <div class="sigil" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M12 2l2.5 5.5L20 10l-4 4 .9 6L12 17.8 7.1 20 8 14 4 10l5.5-2.5L12 2Z"/>
            <path d="M12 6v8"/>
            <path d="M9 11h6"/>
          </svg>
        </div>

        <div>
          <div class="eyebrow">Интерактивный лист персонажа</div>
          <h1 id="heroName">Аурелия</h1>
          <div class="subtitle" id="heroSubtitle">Тифлинг · Бард · Коллегия Мечей</div>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="btn" type="button" data-action="short-rest">Short Rest</button>
        <button class="btn" type="button" data-action="long-rest">Long Rest</button>
      </div>
    </header>

    <main class="app-layout">
      <aside class="sidebar">
        <section class="card section">
          <h2>Портрет</h2>

          <div class="portrait-stage" id="portraitStage">
            <button class="portrait-toggle-btn" id="togglePortraitMotionBtn" type="button" aria-label="Пауза или запуск анимации">
              ❚❚
            </button>
          </div>

          <div class="portrait-controls">
            <label class="btn file-btn" for="portraitFileInput">Выбрать файл</label>
            <input
              id="portraitFileInput"
              class="file-input-hidden"
              type="file"
              accept=".png,.jpg,.jpeg,.gif,.mp4,.webm,image/png,image/jpeg,image/gif,video/mp4,video/webm"
            />
            <button class="btn" id="resetPortraitBtn" type="button">Сбросить</button>
          </div>

          <!-- <div class="hint">
            Можно выбрать локальный PNG, JPG, GIF, MP4 или WebM. После обновления страницы выбранный локальный файл не сохраняется, его нужно будет выбрать заново.
          </div> -->
        </section>

        <section class="card section">
          <h2>Быстрые параметры</h2>
          <div class="quick-stats" id="quickStats"></div>
        </section>

        <section class="card section">
          <h2>Кратко</h2>
          <p class="panel-text" id="sidebarSummary"></p>
        </section>
      </aside>

      <section class="content">
        <nav class="tabs card" aria-label="Разделы листа персонажа">
          <button
            class="tab-btn is-active"
            data-tab="profile"
            type="button"
            aria-label="Профиль"
            data-tooltip="Профиль"
          >
            <span class="tab-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l7 3v5c0 4.5-2.8 7.6-7 10-4.2-2.4-7-5.5-7-10V6l7-3Z"></path>
                <path d="M12 10a2.2 2.2 0 1 0 0-4.4A2.2 2.2 0 0 0 12 10Z"></path>
                <path d="M8.7 16.2c.7-1.8 2-2.7 3.3-2.7s2.6.9 3.3 2.7"></path>
              </svg>
            </span>
          </button>

          <button
            class="tab-btn"
            data-tab="melee"
            type="button"
            aria-label="Бой"
            data-tooltip="Бой"
          >
            <span class="tab-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 18L18 6"></path>
                <path d="M8 6l2 2"></path>
                <path d="M14 14l4 4"></path>
                <path d="M15 5l4 4"></path>
                <path d="M5 15l4 4"></path>
              </svg>
            </span>
          </button>

          <button
            class="tab-btn"
            data-tab="spells"
            type="button"
            aria-label="Заклинания"
            data-tooltip="Заклинания"
          >
            <span class="tab-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3l1.9 4.6L18.5 9l-4.6 1.4L12 15l-1.9-4.6L5.5 9l4.6-1.4L12 3Z"></path>
                <path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9L18 15Z"></path>
              </svg>
            </span>
          </button>

          <button
            class="tab-btn"
            data-tab="inventory"
            type="button"
            aria-label="Инвентарь"
            data-tooltip="Инвентарь"
          >
            <span class="tab-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 8.5V7a4 4 0 0 1 8 0v1.5"></path>
                <path d="M6.5 8.5h11l-1 10a2 2 0 0 1-2 1.8h-5a2 2 0 0 1-2-1.8l-1-10Z"></path>
                <path d="M10 12h4"></path>
              </svg>
            </span>
          </button>

          <button
            class="tab-btn"
            data-tab="lore"
            type="button"
            aria-label="Лор"
            data-tooltip="Лор"
          >
            <span class="tab-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 5.5h8a2 2 0 0 1 2 2V19a2.5 2.5 0 0 0-2.5-2.5H7z"></path>
                <path d="M7 5.5A2.5 2.5 0 0 0 4.5 8V18A2.5 2.5 0 0 1 7 15.5h9"></path>
                <path d="M9 9h5"></path>
                <path d="M9 12h4"></path>
              </svg>
            </span>
          </button>

          <button
            class="tab-btn"
            data-tab="spell-library"
            type="button"
            aria-label="Библиотека заклинаний"
            data-tooltip="Библиотека заклинаний"
          >
            <span class="tab-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6.5 5.5h7a2.5 2.5 0 0 1 2.5 2.5v10.5h-7A2.5 2.5 0 0 0 6.5 21V5.5Z"></path>
                <path d="M17.5 7.5h1a1 1 0 0 1 1 1v10h-8"></path>
                <path d="M9 9.5h4"></path>
                <path d="M9 12.5h5"></path>
                <path d="M9 15.5h3"></path>
              </svg>
            </span>
          </button>
        </nav>

        <section class="tab-panels">
          <article class="tab-panel is-active card section" data-panel="profile">
            <div id="profilePanel"></div>
          </article>

          <article class="tab-panel card section" data-panel="melee">
            <div id="meleePanel"></div>
          </article>

          <article class="tab-panel card section" data-panel="spells">
            <div id="spellsPanel"></div>
          </article>

          <article class="tab-panel card section" data-panel="inventory">
            <div id="inventoryPanel"></div>
          </article>

          <article class="tab-panel card section" data-panel="lore">
            <div id="lorePanel"></div>
          </article>

          <article class="tab-panel card section" data-panel="spell-library">
            <div id="spellLibraryPanel"></div>
          </article>
        </section>
      </section>
    </main>
  </div>
</body>
</html>
